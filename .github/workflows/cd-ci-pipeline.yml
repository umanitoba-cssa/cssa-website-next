name: CI/CD Pipeline

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - release
      - main
  workflow_dispatch:

jobs:
  set-port:
    runs-on: ubuntu-latest
    outputs:
      PORT: ${{ steps.set-port.outputs.PORT }}
      ENVIRONMENT: ${{ steps.set-port.outputs.ENVIRONMENT }}
      ENV_URL: ${{ steps.set-port.outputs.ENV_URL }}
      IMAGE_NAME: ${{ steps.set-port.outputs.IMAGE_NAME }}
      DEPLOY_URL: ${{ steps.set-port.outputs.DEPLOY_URL }}
    steps:
      - name: Set port based on branch
        id: set-port
        run: |
          if [[ "${GITHUB_REF##*/}" == "release" ]]; then
            echo "PORT=80" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=cssa-production" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=https://umanitobacssa.ca" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "release" ]]; then
            echo "PORT=4000" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=cssa-staging" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=https://staging.umanitobacssa.ca" >> $GITHUB_OUTPUT
          else
            echo "PORT=3000" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=preview" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=cssa-preview" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=https://preview.umanitobacssa.ca" >> $GITHUB_OUTPUT
          fi
      - name: Debug outputs
        run: |
          echo "PORT: ${{ steps.set-port.outputs.PORT }}"
          echo "ENVIRONMENT: ${{ steps.set-port.outputs.ENVIRONMENT }}"
          echo "IMAGE_NAME: ${{ steps.set-port.outputs.IMAGE_NAME }}"
          echo "DEPLOY_URL: ${{ steps.set-port.outputs.DEPLOY_URL }}"
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Run ESLint
        run: bun run eslint .

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Run Prettier check
        run: bun run prettier --check .

  build:
    runs-on: ubuntu-latest
    needs: set-port
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Sync markdown content
        run: bun run sync-markdown

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ needs.set-port.outputs.IMAGE_NAME }}:latest
            ${{ needs.set-port.outputs.IMAGE_NAME }}:${{ github.run_number }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker
          build-args: |
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          secrets: |
            "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}"
            "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}"
            "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
            "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            "GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
            "GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}"
            "CANTEEN_SHEEET_ID=${{ secrets.CANTEEN_SHEEET_ID }}"
            "GITHUB_APP_ID=${{ secrets._GITHUB_APP_ID }}"
            "GITHUB_PRIVATE_KEY=${{ secrets._GITHUB_PRIVATE_KEY }}"
            "GOOGLE_CALENDAR_ID=${{ secrets.GOOGLE_CALENDAR_ID }}"
            "RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}"

      - name: Save Docker Image Artifact
        run: |
          mkdir -p image-artifact
          docker save ${{ needs.set-port.outputs.IMAGE_NAME }}:${{ github.run_number }}-${{ github.run_attempt }} > image-artifact/${{ needs.set-port.outputs.IMAGE_NAME }}.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.set-port.outputs.IMAGE_NAME }}
          path: image-artifact/${{ needs.set-port.outputs.IMAGE_NAME }}.tar
          retention-days: 14
  deploy:
    runs-on: [self-hosted, webhost]
    needs: [set-port, eslint, prettier, build]
    environment:
      name: ${{ needs.set-port.outputs.ENVIRONMENT }}
      url: ${{ needs.set-port.outputs.DEPLOY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.set-port.outputs.IMAGE_NAME }}
          path: /tmp/${{ needs.set-port.outputs.ENVIRONMENT }}

      - name: Run Ansible Playbook
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GITHUB_PRIVATE_KEY: ${{ secrets._GITHUB_PRIVATE_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          EXTRA_VARS=$(jq -n \
            --arg port "${{ needs.set-port.outputs.PORT }}" \
            --arg container_name "cssa-${{ needs.set-port.outputs.ENVIRONMENT }}" \
            --arg image_name "${{ needs.set-port.outputs.IMAGE_NAME }}:${{ github.run_number }}-${{ github.run_attempt }}" \
            --arg artifact_path "/tmp/${{ needs.set-port.outputs.ENVIRONMENT }}/${{ needs.set-port.outputs.IMAGE_NAME }}.tar" \
            --arg next_public_recaptcha_site_key "${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}" \
            --arg recaptcha_secret_key "$RECAPTCHA_SECRET_KEY" \
            --arg youtube_api_key "$YOUTUBE_API_KEY" \
            --arg smtp_username "${{ secrets.SMTP_USERNAME }}" \
            --arg smtp_password "$SMTP_PASSWORD" \
            --arg google_client_id "${{ secrets.GOOGLE_CLIENT_ID }}" \
            --arg google_service_account_email "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}" \
            --arg google_private_key "$GOOGLE_PRIVATE_KEY" \
            --arg canteen_sheet_id "${{ secrets.CANTEEN_SHEEET_ID }}" \
            --arg github_app_id "${{ secrets._GITHUB_APP_ID }}" \
            --arg github_private_key "$GITHUB_PRIVATE_KEY" \
            --arg google_calendar_id "${{ secrets.GOOGLE_CALENDAR_ID }}" \
            '{
              port: $port,
              container_name: $container_name,
              image_name: $image_name,
              artifact_path: $artifact_path,
              next_public_recaptcha_site_key: $next_public_recaptcha_site_key,
              recaptcha_secret_key: $recaptcha_secret_key,
              youtube_api_key: $youtube_api_key,
              smtp_username: $smtp_username,
              smtp_password: $smtp_password,
              google_client_id: $google_client_id,
              google_service_account_email: $google_service_account_email,
              google_private_key: $google_private_key,
              canteen_sheet_id: $canteen_sheet_id,
              github_app_id: $github_app_id,
              github_private_key: $github_private_key,
              google_calendar_id: $google_calendar_id
            }')

          ansible-playbook -i "localhost," -c local .ansible/playbook/ansible_deploy_container.yml \
            --extra-vars "$EXTRA_VARS"
